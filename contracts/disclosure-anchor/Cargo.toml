[package]
name = "disclosure-anchor"
version = "0.1.0"
edition = "2021"
description = "familybox: keeps the latest tamper-evident log head per (box, person) on NEAR"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.6"

[dev-dependencies]
near-sdk = { version = "5.6", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
