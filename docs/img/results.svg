<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Leaks out of 39 attacks per run. familybox: 0, 4, 3, 2, 2, then 0 with the health rule. Model reply trusted as is: 13, 13, 14, 14, 14, 12. Every file readable with no checks: 18, 18, 17, 17, 17, 17.">
  <style>
    .bg { fill: #ffffff; } .ink { fill: #16171a; } .mut { fill: #5d6066; } .grid { stroke: #e6e4e0; }
    .home { fill: #1f7a4a; } .bad { fill: #b3261e; } .bad2 { fill: #8a8d93; }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; } .ink { fill: #e6edf3; } .mut { fill: #9198a1; } .grid { stroke: #30363d; }
      .home { fill: #3fb950; } .bad { fill: #f85149; } .bad2 { fill: #9198a1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="760" height="300" rx="12"/>
  <text class="ink" x="28" y="40" font-size="19" font-weight="600">Leaks out of 39 attacks, six real runs on NEAR AI Cloud</text>
  <text class="mut" x="28" y="62" font-size="13">Same model, same attacks, fictional data. Dots are runs; the number is the average.</text>
  <!-- axis: x from 230 (0) to 700 (20) -->
  <g class="grid" stroke-width="1">
    <line x1="230" y1="84" x2="230" y2="262"/><line x1="347.5" y1="84" x2="347.5" y2="262"/>
    <line x1="465" y1="84" x2="465" y2="262"/><line x1="582.5" y1="84" x2="582.5" y2="262"/>
    <line x1="700" y1="84" x2="700" y2="262"/>
  </g>
  <g class="mut" font-size="12" text-anchor="middle">
    <text x="230" y="282">0</text><text x="347.5" y="282">5</text><text x="465" y="282">10</text>
    <text x="582.5" y="282">15</text><text x="700" y="282">20</text>
  </g>
  <!-- familybox: 0,4,3,2,2,0 avg 1.8 -->
  <text class="ink" x="214" y="117" font-size="15" font-weight="600" text-anchor="end">familybox</text>
  <text class="mut" x="214" y="134" font-size="12" text-anchor="end">box checks every answer</text>
  <rect class="home" x="230" y="104" width="42.3" height="22" rx="4" opacity=".22"/>
  <g class="home"><circle cx="230" cy="115" r="5"/><circle cx="230" cy="124" r="5"/><circle cx="324" cy="115" r="5"/><circle cx="300.5" cy="115" r="5"/><circle cx="277" cy="115" r="5"/><circle cx="277" cy="124" r="5"/></g>
  <text class="ink" x="340" y="120" font-size="13" font-weight="600">avg 1.8 · no SSN or ID ever</text>
  <!-- trust the reply: 13,13,14,14,14,12 avg 13.3 -->
  <text class="ink" x="214" y="177" font-size="15" text-anchor="end">Reply trusted as is</text>
  <text class="mut" x="214" y="194" font-size="12" text-anchor="end">same model, no gate</text>
  <rect class="bad" x="230" y="164" width="313" height="22" rx="4" opacity=".2"/>
  <g class="bad"><circle cx="535.5" cy="175" r="5"/><circle cx="535.5" cy="184" r="5"/><circle cx="559" cy="175" r="5"/><circle cx="559" cy="184" r="5"/><circle cx="559" cy="166" r="5"/><circle cx="512" cy="175" r="5"/></g>
  <text class="ink" x="578" y="180" font-size="13">avg 13.3</text>
  <!-- every file: 18,18,17,17,17,17 avg 17.3 -->
  <text class="ink" x="214" y="237" font-size="15" text-anchor="end">Every file, no checks</text>
  <text class="mut" x="214" y="254" font-size="12" text-anchor="end">like pasting into a chat</text>
  <rect class="bad2" x="230" y="224" width="407" height="22" rx="4" opacity=".25"/>
  <g class="bad2"><circle cx="653" cy="235" r="5"/><circle cx="653" cy="244" r="5"/><circle cx="629.5" cy="235" r="5"/><circle cx="629.5" cy="244" r="5"/><circle cx="629.5" cy="226" r="5"/><circle cx="629.5" cy="217" r="5"/></g>
  <text class="ink" x="668" y="240" font-size="13">avg 17.3</text>
</svg>
