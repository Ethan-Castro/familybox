[project]
name = "familybox"
version = "0.1.0"
description = "A household privacy box: assistants ask, a NEAR AI enclave model reads the family's files, the box checks every answer."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "nearai-inference-sdk==0.3.0",
    "mcp==2.3.0",
    "starlette>=1.10",
    "uvicorn>=0.54",
    "python-multipart>=0.0.33",
    "httpx>=0.28.1,<0.29",
    "pynacl>=1.6",
    "cryptography>=44",
    "pillow>=11",
    "pypdf==7.0.0",
    "segno>=1.6.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familybox"]

[project.scripts]
familybox = "familybox.cli:main"
familybox-mcp = "familybox.mcp_server:main"
